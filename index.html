<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030917">
<meta name="referrer" content="no-referrer">
<title>TaskFlow</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030814;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}
#tfBoot{display:none;position:fixed;inset:0;z-index:2147483647;place-items:center;padding:20px;background:#030814}
#tfBoot.error{display:grid}
#tfBoot[hidden]{display:none!important}
.tfCard{width:min(400px,100%);padding:24px;border:1px solid rgba(54,213,228,.45);border-radius:20px;background:#08182a;text-align:center}
.tfErr{margin:0;color:#e6edf7;font-size:14px;line-height:1.5}
.tfRetry{margin-top:18px;min-height:44px;border:1px solid #34e3ee;border-radius:12px;padding:10px 22px;background:#086577;color:#fff;font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.tfRetry:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* TaskFlow T85 — 1080x1920 Full HD artwork + original touch waves.
   Do not add a second splash illustration, footer or progress control. */
#tfSplash{position:fixed;inset:0;z-index:2147483644;display:grid;place-items:center;overflow:hidden;overscroll-behavior:none;background:radial-gradient(ellipse at 50% 45%,#102c4d 0%,#030d1c 62%,#020713 100%)}
#tfSplash[hidden]{display:none!important}
.tfSplashArt{position:relative;width:min(100vw,56.25dvh);max-width:100%;aspect-ratio:9/16;max-height:100dvh;overflow:hidden;isolation:isolate;background:#030814;container-type:inline-size}
.tfSplashImage{position:relative;z-index:0;display:block;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none;pointer-events:none;image-rendering:auto}
.tfSplashFallback{position:absolute;inset:0;z-index:0;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse,#103257,#030814);color:#72effa;font-weight:900;font-size:clamp(32px,10cqw,64px)}
#tfSplash.fallback .tfSplashImage{visibility:hidden}
#tfSplash.fallback .tfSplashFallback{display:flex}
/* Waves revive the previous tap animation without covering the HD image. */
#tfSplashSlats{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:.07;mix-blend-mode:screen;transition:opacity .25s ease;mask-image:radial-gradient(ellipse 85% 83% at 50% 50%,transparent 37%,rgba(0,0,0,.3) 73%,#000 100%);-webkit-mask-image:radial-gradient(ellipse 85% 83% at 50% 50%,transparent 37%,rgba(0,0,0,.3) 73%,#000 100%)}
#tfSplash.tf-slats-touched #tfSplashSlats{opacity:.33}
#tfSplashSlats canvas{display:block;width:100%;height:100%;pointer-events:none}
.tfSplashWave{position:absolute;z-index:3;left:50%;top:50%;width:24px;height:24px;box-sizing:border-box;border:2px solid rgba(115,246,255,.96);border-radius:50%;pointer-events:none;box-shadow:0 0 15px 3px rgba(12,226,249,.74),inset 0 0 10px rgba(176,83,255,.75);background:radial-gradient(circle,rgba(8,232,248,.23),rgba(127,62,255,.12) 45%,transparent 70%);transform:translate(-50%,-50%) scale(.3);animation:tfSplashTouchWave .93s ease-out forwards}
@keyframes tfSplashTouchWave{0%{opacity:.96;transform:translate(-50%,-50%) scale(.3)}34%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(10)}}
/* The existing printed meter is fully covered by this ONE real meter. */
.tfSplashMeter{position:absolute;z-index:4;top:54.55%;left:12.6%;width:74.8%;height:3.55%;display:flex;align-items:center;gap:3%;padding:0 2%;border:1px solid rgba(38,173,226,.58);border-radius:999px;background:linear-gradient(90deg,#06365a 0%,#081c3a 79%,#06213d 100%);box-shadow:0 0 10px rgba(18,169,240,.17),inset 0 0 9px #0009;box-sizing:border-box;pointer-events:none}
.tfSplashTrack{display:block;position:relative;flex:1;min-width:0;height:49%;min-height:5px;overflow:hidden;border:1px solid #246797;border-radius:999px;background:#07132c;box-shadow:inset 0 1px 4px #000a}
#tfSplashFill{display:block;width:100%;height:100%;border-radius:inherit;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,#00ebed,#168dfe 26%,#7845fa 55%,#f044ce 80%,#ffc87b);box-shadow:0 0 10px rgba(21,212,250,.83);will-change:transform}
#tfSplashPercent{min-width:10%;text-align:right;color:#f5fdff;font:900 clamp(10px,3.2cqw,21px)/1 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #00b3f657}
@media(prefers-reduced-motion:reduce){#tfSplashSlats,.tfSplashWave{display:none!important}#tfSplashFill{transition:none!important}}
</style>
</head>
<body>
<div id="tfSplash" role="status" aria-label="Cargando TaskFlow">
 <div class="tfSplashArt">
  <img class="tfSplashImage" src="./taskflow-loading-fhd-1080x1920.webp" alt="TaskFlow — Organiza · Avanza · Cumple" width="1080" height="1920" fetchpriority="high" decoding="async" onerror="document.getElementById('tfSplash').classList.add('fallback')">
  <div class="tfSplashFallback" aria-hidden="true">TaskFlow</div>
  <div id="tfSplashSlats" aria-hidden="true"></div>
  <div class="tfSplashMeter" id="tfSplashMeter" role="progressbar" aria-label="Inicio de TaskFlow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <span class="tfSplashTrack"><i id="tfSplashFill"></i></span><strong id="tfSplashPercent">0%</strong>
  </div>
 </div>
</div>
<div id="tfBoot" role="alert" aria-live="assertive" hidden><div class="tfCard"><p class="tfErr" id="tfErr">No fue posible iniciar TaskFlow. Comprueba tu conexión y vuelve a intentarlo.</p><button class="tfRetry" type="button" onclick="location.reload()">Reintentar</button></div></div>

<script src="./taskflow-microslats.js?v=3-fhd-touch-20261107" defer></script>
<script>
(async function(){
'use strict';
const boot=document.getElementById('tfBoot');
const splash=document.getElementById('tfSplash');
const splashFill=document.getElementById('tfSplashFill');
const splashPct=document.getElementById('tfSplashPercent');
const splashMeter=document.getElementById('tfSplashMeter');
const SPLASH_MS=10000;
const splashStart=performance.now();
let splashDone=false,progressRaf=0;
function showProgress(now){
 if(splashDone||!splash.isConnected)return;
 const value=Math.max(0,Math.min(100,Math.floor((now-splashStart)*100/SPLASH_MS)));
 if(splashFill)splashFill.style.transform='scaleX('+(value/100)+')';
 if(splashPct)splashPct.textContent=value+'%';
 if(splashMeter)splashMeter.setAttribute('aria-valuenow',String(value));
 if(value<100)progressRaf=requestAnimationFrame(showProgress);
}
progressRaf=requestAnimationFrame(showProgress);
function endSplash(){
 try{window.TaskFlowMicroSlats&&window.TaskFlowMicroSlats.stop()}catch(_){}
 splashDone=true;
 if(progressRaf)cancelAnimationFrame(progressRaf);
 splash.hidden=true;
}
async function keepSplashExactlyTenSeconds(){
 const remaining=Math.max(0,SPLASH_MS-(performance.now()-splashStart));
 if(remaining>0)await new Promise(resolve=>setTimeout(resolve,remaining));
 // Los temporizadores pueden retrasarse si la aplicación queda en segundo plano.
 // Nunca sustituir una app incompleta por una pantalla vacía.
}

const parts=["t57/runtime-00.txt","t57/runtime-01.txt","t57/runtime-02.txt","t57/runtime-03.txt","t57/runtime-04.txt","t57/runtime-05.txt","t57/runtime-06.txt","t57/runtime-07.txt","t57/runtime-08.txt","t57/runtime-09.txt","t57/runtime-10.txt","t57/runtime-11.txt","t57/runtime-12.txt","t57/runtime-13.txt","t57/runtime-14.txt","t57/runtime-15.txt","t57/runtime-16.txt","t57/runtime-17.txt","t57/runtime-18.txt","t57/runtime-19.txt","t57/runtime-20.txt","t57/runtime-21.txt","t57/runtime-22.txt","t57/runtime-23.txt","t57/runtime-24.txt"];
try{
 // Limitar conexiones simultáneas evita saturar redes móviles y WebViews.
 const texts=new Array(parts.length);
 let next=0;
 async function loadPart(p){
   const version=p==='t57/runtime-00.txt'?'?v=72-routine-state-20261108':/^t57\/runtime-0[012]\.txt$/.test(p)?'?v=63-no-splash-assets-20261106':p==='t57/runtime-06.txt'?'?v=59-auth-memory-20261106':p==='t57/runtime-24.txt'?'?v=95-center-sung-legal-checks-20261108':p==='t57/runtime-03.txt'?'?v=96-original-mentalista-progress-20261108':p==='t57/runtime-19.txt'?'?v=73-campaign-results-all-ads-20261107':'?v=57-ads21-paypal6-dailyfix1';
   const url='./'+p+version;
   for(let attempt=0;attempt<2;attempt++){
     const controller=new AbortController();
     const timeout=setTimeout(()=>controller.abort(),14000);
     try{
       const response=await fetch(url,{cache:'default',credentials:'same-origin',signal:controller.signal});
       if(!response.ok)throw new Error('LOAD_'+response.status);
       const body=await response.text();
       if(!body||body.length<50)throw new Error('EMPTY_PART');
       return body;
     }catch(error){
       if(attempt===1||/LOAD_4\d\d/.test(String(error&&error.message)))throw error;
       await new Promise(resolve=>setTimeout(resolve,260));
     }finally{clearTimeout(timeout)}
   }
 }
 async function worker(){
   for(;;){
     const i=next++;
     if(i>=parts.length)return;
     texts[i]=await loadPart(parts[i]);
   }
 }
 await Promise.all(Array.from({length:Math.min(6,parts.length)},()=>worker()));
 const html=texts.join('');
 if(!html.toLowerCase().includes('<!doctype html>')||!html.includes('TF_T57')||!/<\/html>\s*$/i.test(html))throw new Error('INVALID');
 await keepSplashExactlyTenSeconds();
 endSplash();
 document.open();document.write(html);document.close();
}catch(error){console.warn('TaskFlow: fallo de arranque',error&&error.message||error);endSplash();boot.hidden=false;boot.classList.add('error')}
})();
</script>
</body>
</html>
