<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030917">
<meta name="referrer" content="no-referrer">
<title>TaskFlow</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030814;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}
#tfBoot{display:none;position:fixed;inset:0;z-index:2147483647;place-items:center;padding:20px;background:#030814}
#tfBoot.error{display:grid}
#tfBoot[hidden]{display:none!important}
.tfCard{width:min(400px,100%);padding:24px;border:1px solid rgba(54,213,228,.45);border-radius:20px;background:#08182a;text-align:center}
.tfErr{margin:0;color:#e6edf7;font-size:14px;line-height:1.5}
.tfRetry{margin-top:18px;min-height:44px;border:1px solid #34e3ee;border-radius:12px;padding:10px 22px;background:#086577;color:#fff;font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.tfRetry:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* TaskFlow loader T83: full reference illustration with TaskFlow branding.
   Only the footer and progress are live overlays; preserve the illustration. */
#tfSplash{position:fixed;inset:0;z-index:2147483644;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#082846,#030c1d 70%,#020713)}
#tfSplash[hidden]{display:none!important}
.tfSplashArt{position:relative;width:min(100vw,49.81dvh);max-width:100%;aspect-ratio:765/1536;max-height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(160deg,#030c18 0%,#061b2c 6%,#02101d 94%,#030b1a 100%);container-type:inline-size}
.tfSplashOriginal{position:absolute;z-index:0;left:0;top:5.66%;width:100%;height:88.68%;object-fit:fill;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.tfSplashOriginalFallback{position:absolute;inset:0;z-index:0;display:none;align-items:center;justify-content:center;text-align:center;color:#66eafd;background:radial-gradient(ellipse,#09315c,#030d20);font-size:clamp(32px,10cqw,64px);font-weight:950}
#tfSplash.fallback .tfSplashOriginal{visibility:hidden}
#tfSplash.fallback .tfSplashOriginalFallback{display:flex}
#tfSplashSlats{position:absolute;z-index:1;inset:5.66% 0 6%;pointer-events:none;overflow:hidden;opacity:.13;mask-image:linear-gradient(#000,transparent 50%);-webkit-mask-image:linear-gradient(#000,transparent 50%)}
#tfSplashSlats canvas{width:100%;height:100%;display:block}
#tfSplash.tf-slats-touched #tfSplashSlats{opacity:.3}
.tfSplashWave{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;pointer-events:none;border:2px solid rgba(43,237,251,.8);box-shadow:0 0 15px #19cbee;transform:translate(-50%,-50%) scale(.2);animation:tfSplashRipple .93s ease-out forwards}
@keyframes tfSplashRipple{to{opacity:0;transform:translate(-50%,-50%) scale(11)}}
/* Replace the embedded 78% of the illustration with a functioning progress bar. */
.tfSplashMeter{position:absolute;z-index:4;top:54.25%;left:12.3%;width:75.4%;height:3.5%;min-height:18px;display:flex;gap:3%;align-items:center;padding:0 2.2%;border:1px solid rgba(26,171,233,.46);border-radius:999px;background:linear-gradient(95deg,#051a38 0%,#06162e 100%);box-shadow:0 0 15px #0c9df03a,inset 0 0 13px #000a;pointer-events:none}
.tfSplashTrack{flex:1;min-width:0;display:block;height:43%;min-height:6px;max-height:11px;overflow:hidden;border-radius:999px;border:1px solid #226594;background:#031327;box-shadow:inset 0 1px 6px #0008}
#tfSplashFill{display:block;width:100%;height:100%;border-radius:inherit;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#04f4f4 0%,#20a6fd 27%,#7648ff 54%,#f151df 77%,#ffc478 100%);box-shadow:0 0 12px #08c5ebc9}
#tfSplashPercent{min-width:11%;text-align:right;font-weight:900;font-size:clamp(11px,3.7cqw,21px);line-height:1;font-variant-numeric:tabular-nums;color:#effaff;text-shadow:0 0 8px #23d4ff40}
/* The old footer in the underlying image displayed another brand; this panel
   covers ONLY that area with the TaskFlow footer from the provided reference. */
.tfSplashFooter{position:absolute;z-index:3;left:12.5%;top:70.7%;width:75%;height:11%;padding:2.7% 4.1% 2.1%;display:flex;align-items:center;flex-direction:column;justify-content:space-between;text-align:center;border:1px solid rgba(94,145,194,.2);border-radius:6.5%/22%;background:radial-gradient(ellipse 60% 100% at 15% 20%,#13366155,transparent),linear-gradient(170deg,#060d22 0%,#0b1530 68%,#070d24 100%);box-shadow:inset 0 0 13px #0c26447a,0 0 12px #0814267a}
.tfSplashFooterBrand{display:flex;align-items:center;justify-content:center;gap:2.2%;width:100%;line-height:1;white-space:nowrap;font-size:clamp(16px,5.8cqw,35px);font-weight:950;letter-spacing:-.05em;background:linear-gradient(94deg,#08edfa,#93cbff 49%,#ffcb68);background-clip:text;-webkit-background-clip:text;color:transparent}
.tfSplashFooterBrand svg{width:11%;height:auto;max-height:30px;min-width:16px;color:#17d9f5;filter:drop-shadow(0 0 6px #00bfff)}
.tfSplashFooterSub{font-size:clamp(5px,1.9cqw,12px);font-weight:900;letter-spacing:.28em;color:#bfcadb;text-transform:uppercase;white-space:nowrap}
.tfSplashFooterMotto{display:flex;align-items:center;justify-content:center;width:100%;min-height:25%;padding:1.4% 1%;border-radius:100px;border:1px solid rgba(142,186,229,.35);background:#061229dc;box-shadow:inset 0 1px 9px #1039689e}
.tfSplashFooterMotto span{flex:1;min-width:0;color:#dee5f5;font-size:clamp(6px,2.15cqw,14px);line-height:1.3;white-space:nowrap}
.tfSplashFooterMotto span+span{border-left:1px solid #92c4e044}
.tfSplashFooterMotto b{color:#47e3f3;font-size:1.2em}
@media(max-width:350px){.tfSplashFooter{padding:2.2% 2.8%}.tfSplashMeter{padding:0 1.9%}.tfSplashFooterMotto span{font-size:2cqw}}
@media(prefers-reduced-motion:reduce){.tfSplashWave{display:none!important}}
</style>
</head>
<body>
<div id="tfSplash" role="status" aria-label="Cargando TaskFlow">
 <div class="tfSplashArt">
  <img class="tfSplashOriginal" src="./taskflow-loading-reference.jpg" alt="TaskFlow · Organiza · Avanza · Cumple" width="864" height="1536" fetchpriority="high" decoding="async" onerror="document.getElementById('tfSplash').classList.add('fallback')">
  <div class="tfSplashOriginalFallback" aria-hidden="true">TaskFlow</div>
  <div id="tfSplashSlats" aria-hidden="true"></div>
  <div class="tfSplashMeter" role="progressbar" aria-label="Inicio de TaskFlow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tfSplashMeter">
   <span class="tfSplashTrack"><i id="tfSplashFill"></i></span><strong id="tfSplashPercent">0%</strong>
  </div>
  <div class="tfSplashFooter" aria-hidden="true">
   <div class="tfSplashFooterBrand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20l7-7 4 4 9-13M16 4h6v6"/></svg>
    <span>TaskFlow</span>
   </div>
   <div class="tfSplashFooterSub">TU SISTEMA DE PRODUCTIVIDAD</div>
   <div class="tfSplashFooterMotto"><span><b>◇</b> Organiza</span><span><b>ϟ</b> Avanza</span><span><b>◎</b> Cumple</span></div>
  </div>
 </div>
</div>
<div id="tfBoot" role="alert" aria-live="assertive" hidden><div class="tfCard"><p class="tfErr" id="tfErr">No fue posible iniciar TaskFlow. Comprueba tu conexión y vuelve a intentarlo.</p><button class="tfRetry" type="button" onclick="location.reload()">Reintentar</button></div></div>
<script src="./taskflow-microslats.js?v=2-touch-ripple" defer></script>
<script>
(async function(){
'use strict';
const boot=document.getElementById('tfBoot');
const splash=document.getElementById('tfSplash');
const splashFill=document.getElementById('tfSplashFill');
const splashPct=document.getElementById('tfSplashPercent');
const splashMeter=document.getElementById('tfSplashMeter');
const SPLASH_MS=10000;
const splashStart=performance.now();
let splashDone=false,progressRaf=0;
function showProgress(now){
 if(splashDone||!splash.isConnected)return;
 const value=Math.max(0,Math.min(100,Math.floor((now-splashStart)*100/SPLASH_MS)));
 if(splashFill)splashFill.style.transform='scaleX('+(value/100)+')';
 if(splashPct)splashPct.textContent=value+'%';
 if(splashMeter)splashMeter.setAttribute('aria-valuenow',String(value));
 if(value<100)progressRaf=requestAnimationFrame(showProgress);
}
progressRaf=requestAnimationFrame(showProgress);
function endSplash(){
 try{window.TaskFlowMicroSlats&&window.TaskFlowMicroSlats.stop()}catch(_){}
 splashDone=true;
 if(progressRaf)cancelAnimationFrame(progressRaf);
 splash.hidden=true;
}
async function keepSplashExactlyTenSeconds(){
 const remaining=Math.max(0,SPLASH_MS-(performance.now()-splashStart));
 if(remaining>0)await new Promise(resolve=>setTimeout(resolve,remaining));
 // Los temporizadores pueden retrasarse si la aplicación queda en segundo plano.
 // Nunca sustituir una app incompleta por una pantalla vacía.
}

const parts=["t57/runtime-00.txt","t57/runtime-01.txt","t57/runtime-02.txt","t57/runtime-03.txt","t57/runtime-04.txt","t57/runtime-05.txt","t57/runtime-06.txt","t57/runtime-07.txt","t57/runtime-08.txt","t57/runtime-09.txt","t57/runtime-10.txt","t57/runtime-11.txt","t57/runtime-12.txt","t57/runtime-13.txt","t57/runtime-14.txt","t57/runtime-15.txt","t57/runtime-16.txt","t57/runtime-17.txt","t57/runtime-18.txt","t57/runtime-19.txt","t57/runtime-20.txt","t57/runtime-21.txt","t57/runtime-22.txt","t57/runtime-23.txt","t57/runtime-24.txt"];
try{
 // Limitar conexiones simultáneas evita saturar redes móviles y WebViews.
 const texts=new Array(parts.length);
 let next=0;
 async function loadPart(p){
   const version=p==='t57/runtime-00.txt'?'?v=71-hub-cards-20261106':/^t57\/runtime-0[012]\.txt$/.test(p)?'?v=63-no-splash-assets-20261106':p==='t57/runtime-06.txt'?'?v=59-auth-memory-20261106':p==='t57/runtime-24.txt'?'?v=81-noads-entitlement-20261107':p==='t57/runtime-19.txt'?'?v=73-campaign-results-all-ads-20261107':'?v=57-ads21-paypal6-dailyfix1';
   const url='./'+p+version;
   for(let attempt=0;attempt<2;attempt++){
     const controller=new AbortController();
     const timeout=setTimeout(()=>controller.abort(),14000);
     try{
       const response=await fetch(url,{cache:'default',credentials:'same-origin',signal:controller.signal});
       if(!response.ok)throw new Error('LOAD_'+response.status);
       const body=await response.text();
       if(!body||body.length<50)throw new Error('EMPTY_PART');
       return body;
     }catch(error){
       if(attempt===1||/LOAD_4\d\d/.test(String(error&&error.message)))throw error;
       await new Promise(resolve=>setTimeout(resolve,260));
     }finally{clearTimeout(timeout)}
   }
 }
 async function worker(){
   for(;;){
     const i=next++;
     if(i>=parts.length)return;
     texts[i]=await loadPart(parts[i]);
   }
 }
 await Promise.all(Array.from({length:Math.min(6,parts.length)},()=>worker()));
 const html=texts.join('');
 if(!html.toLowerCase().includes('<!doctype html>')||!html.includes('TF_T57')||!/<\/html>\s*$/i.test(html))throw new Error('INVALID');
 await keepSplashExactlyTenSeconds();
 endSplash();
 document.open();document.write(html);document.close();
}catch(error){console.warn('TaskFlow: fallo de arranque',error&&error.message||error);endSplash();boot.hidden=false;boot.classList.add('error')}
})();
</script>
</body>
</html>
