<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030917">
<meta name="referrer" content="no-referrer">
<title>TaskFlow</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030814;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}
#tfBoot{display:none;position:fixed;inset:0;z-index:2147483647;place-items:center;padding:20px;background:#030814}
#tfBoot.error{display:grid}
#tfBoot[hidden]{display:none!important}
.tfCard{width:min(400px,100%);padding:24px;border:1px solid rgba(54,213,228,.45);border-radius:20px;background:#08182a;text-align:center}
.tfErr{margin:0;color:#e6edf7;font-size:14px;line-height:1.5}
.tfRetry{margin-top:18px;min-height:44px;border:1px solid #34e3ee;border-radius:12px;padding:10px 22px;background:#086577;color:#fff;font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.tfRetry:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* TaskFlow splash T82 — responsive live HTML/CSS layout based on user reference.
   The original picture provides only the top illustration and the floor scenery. */
#tfSplash{position:fixed;inset:0;z-index:2147483644;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse 80% 64% at 50% 48%,#092b46 0%,#041327 50%,#020714 100%);overscroll-behavior:none}
#tfSplash[hidden]{display:none!important}
.tfSplashArt{position:relative;isolation:isolate;width:min(100vw,49.81dvh,480px);max-width:100%;aspect-ratio:765/1536;max-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 27%,#063451,#06152a 60%,#030913);container-type:inline-size;box-shadow:0 0 55px #04a9e01e}
.tfSplashBackdrop,.tfSplashFloor{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
.tfSplashBackdrop{z-index:0;opacity:.94;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 34%,transparent 46%);mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 34%,transparent 46%)}
.tfSplashFloor{z-index:0;opacity:.9;clip-path:inset(78% 0 0 0);-webkit-mask-image:linear-gradient(to bottom,transparent 76%,#000 84%,#000 95%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 76%,#000 84%,#000 95%,transparent 100%)}
.tfSplashAura{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 58% 18% at 21% 34%,#05d8ff20,transparent 76%),radial-gradient(ellipse 35% 23% at 85% 45%,#ff8e2a20,transparent 80%),radial-gradient(ellipse 52% 20% at 50% 86%,#8a3aff22,transparent 80%)}
.tfSplashBoard{position:absolute;z-index:3;top:32.8%;left:8.15%;width:83.7%;height:51.5%;padding:4.7% 5.2% 3.6%;display:flex;flex-direction:column;align-items:center;border:1px solid rgba(50,218,248,.58);border-radius:8.1%/4%;background:radial-gradient(ellipse 64% 24% at 8% 0%,#1576a431,transparent),radial-gradient(ellipse 54% 42% at 102% 24%,#8c20c518,transparent),linear-gradient(155deg,rgba(5,22,45,.97),rgba(10,14,43,.98) 62%,rgba(9,15,36,.96));box-shadow:0 0 20px #08dfff50,0 0 16px #fa6e4940,inset 0 1px 1px #b8efff35,inset 0 0 34px #071c4c9e;text-align:center}
.tfSplashBoard::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 12px #2eeaff28,inset -2px -3px 20px #ec43ff18}
.tfSplashBoard::after{content:"";position:absolute;inset:auto 8% -2px;height:2px;pointer-events:none;border-radius:999px;background:linear-gradient(90deg,transparent,#07effd88 14%,#c837ff91 77%,transparent);filter:blur(2px)}
.tfSplashHeading{flex:none;max-width:100%;font:900 clamp(33px,10.2cqw,66px)/1.04 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.065em;white-space:nowrap;background:linear-gradient(100deg,#05f2ef 4%,#b4eefa 40%,#fff0de 57%,#ffbd50 85%,#ff8d33 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 11px #25d9fa24)}
.tfSplashMotto{flex:none;margin:1.7% 0 0;color:#d8e7f3;font-size:clamp(7px,2.3cqw,14px);font-weight:800;letter-spacing:.31em;line-height:1.5;text-transform:uppercase;white-space:nowrap}
.tfSplashDivider{flex:none;width:52%;height:2px;margin-top:4%;border-radius:99px;background:linear-gradient(90deg,transparent,#0aebf6 25%,#f4bf63 74%,transparent);box-shadow:0 0 9px #22bde288}
.tfSplashLoaderText{flex:none;display:flex;align-items:center;justify-content:center;gap:3%;margin-top:4.1%;width:85%;min-height:6.25%;border-radius:999px;border:1px solid #1168a373;background:linear-gradient(100deg,#061b35,#08162f);box-shadow:inset 0 0 10px #1ea9fa17,0 0 11px #16a5ff24;color:#e3f0f9;font-size:clamp(10px,3.45cqw,18px);font-weight:550}
.tfSplashLight{flex:none;width:9px;height:9px;border-radius:50%;background:#74ffff;box-shadow:0 0 5px #9dffff,0 0 12px #00eaff,0 0 21px #1ba1fe;animation:tfSplashBlink 1.65s ease-in-out infinite}
@keyframes tfSplashBlink{50%{opacity:.65;box-shadow:0 0 4px #b8ffff,0 0 6px #00eaff}}
.tfSplashMeter{display:flex;align-items:center;gap:3.7%;flex:none;width:100%;height:7%;min-height:16px;margin-top:3.7%;padding:0 2.6%;border:1px solid rgba(39,155,221,.43);border-radius:999px;background:linear-gradient(95deg,#051b37f2,#03152fe8);box-shadow:0 0 14px #08bff92f,inset 0 0 10px #0009}
.tfSplashTrack{display:block;position:relative;flex:1;height:48%;min-height:6px;max-height:12px;overflow:hidden;border-radius:99px;border:1px solid #155891;background:#06132b;box-shadow:inset 0 1px 7px #000c}
#tfSplashFill{display:block;width:100%;height:100%;border-radius:inherit;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,#07ebee,#1677fd 31%,#8946ff 59%,#e63ddd 79%,#ffbd76);box-shadow:0 0 12px #1cfbffc2;will-change:transform}
#tfSplashPercent{flex:0 0 11%;min-width:0;font-size:clamp(11px,3.8cqw,21px);line-height:1;font-weight:900;color:#f0fbff;font-variant-numeric:tabular-nums;text-shadow:0 0 7px #09bdf52a}
.tfSplashTiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3%;flex:none;width:100%;margin-top:7.1%}
.tfSplashTile{display:flex;align-items:center;flex-direction:column;gap:7px;min-width:0;color:#55f1f0}
.tfSplashTile:nth-child(2){color:#c484ff}
.tfSplashTile:nth-child(3){color:#ffc66b}
.tfSplashTile:nth-child(4){color:#59f7d8}
.tfSplashTileIcon{display:grid;place-items:center;width:min(100%,13.7cqw);aspect-ratio:1;border:1px solid currentColor;border-radius:21%;background:linear-gradient(145deg,#1f356146,#07182bdd);box-shadow:0 0 13px currentColor,inset 0 0 10px #FFFFFF0a;animation:tfSplashFloat 3.8s ease-in-out infinite}
.tfSplashTile:nth-child(2) .tfSplashTileIcon{animation-delay:.4s}
.tfSplashTile:nth-child(3) .tfSplashTileIcon{animation-delay:.8s}
.tfSplashTile:nth-child(4) .tfSplashTileIcon{animation-delay:1.2s}
.tfSplashTileIcon svg{width:55%;height:55%;filter:drop-shadow(0 0 6px currentColor)}
.tfSplashTileLabel{font-size:clamp(7px,2.05cqw,13px);line-height:1.3;letter-spacing:.12em;font-weight:850;text-transform:uppercase;white-space:nowrap}
@keyframes tfSplashFloat{0%,100%{transform:translateY(0);box-shadow:0 0 9px currentColor}50%{transform:translateY(-3px);box-shadow:0 0 14px currentColor}}
.tfSplashSignature{width:100%;margin-top:auto;padding-top:4.2%;border-top:1px solid rgba(118,170,213,.15)}
.tfSplashSigTitle{display:flex;align-items:center;justify-content:center;gap:2.5%;font-weight:900;font-size:clamp(18px,6cqw,36px);letter-spacing:-.035em;line-height:1.05;background:linear-gradient(100deg,#19f2ec,#9ec8fd 50%,#ffc460);color:transparent;background-clip:text;-webkit-background-clip:text}
.tfSplashSigTitle svg{width:10%;max-width:30px;min-width:18px;height:auto;color:#54eaf5}
.tfSplashSigSub{margin:2.5% 0 4.5%;font-size:clamp(6.5px,2.25cqw,12px);font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#ced9e5}
.tfSplashSigPill{display:flex;align-items:center;justify-content:center;gap:0;border:1px solid rgba(138,186,223,.31);border-radius:100px;min-height:27px;padding:2.5% 0;background:#061128bc;box-shadow:inset 0 1px 7px #093868}
.tfSplashSigPill span{flex:1;text-align:center;font-size:clamp(7px,2.5cqw,13px);font-weight:600;color:#d6e6f7}
.tfSplashSigPill span+span{border-left:1px solid rgba(129,176,217,.41)}
.tfSplashSigPill b{font-size:1.2em;font-weight:900;color:#45e5ef}
#tfSplashSlats{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.13;overflow:hidden;mask-image:linear-gradient(to bottom,#000 0%,transparent 40%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 40%)}
#tfSplashSlats canvas{display:block;width:100%;height:100%;pointer-events:none}
#tfSplash.tf-slats-touched #tfSplashSlats{opacity:.25}
.tfSplashWave{position:absolute;left:50%;top:50%;width:20px;height:20px;border:1px solid #38eafb;border-radius:50%;pointer-events:none;box-shadow:0 0 15px #0bc7f8;transform:translate(-50%,-50%) scale(.2);animation:tfSplashRipple .92s ease-out forwards}
@keyframes tfSplashRipple{to{opacity:0;transform:translate(-50%,-50%) scale(11)}}
@media(max-width:350px){.tfSplashArt{width:min(100vw,49.81dvh)}.tfSplashBoard{padding:4% 4.5% 3%}.tfSplashTile{gap:4px}.tfSplashTiles{margin-top:5.8%}.tfSplashSigPill{min-height:23px}}
@media(max-height:610px){.tfSplashArt{width:min(100vw,49.81dvh)}}
@media(prefers-reduced-motion:reduce){.tfSplashWave{display:none!important}.tfSplashTileIcon,.tfSplashLight{animation:none!important}}
</style>
</head>
<body>
<div id="tfSplash" role="status" aria-label="Cargando TaskFlow">
  <div class="tfSplashArt">
    <img class="tfSplashBackdrop" src="./taskflow-loading-reference.jpg" alt="" aria-hidden="true" fetchpriority="high" decoding="async">
    <img class="tfSplashFloor" src="./taskflow-loading-reference.jpg" alt="" aria-hidden="true" decoding="async">
    <div class="tfSplashAura" aria-hidden="true"></div>
    <div id="tfSplashSlats" aria-hidden="true"></div>
    <section class="tfSplashBoard" aria-labelledby="tfSplashBrand">
      <strong class="tfSplashHeading" id="tfSplashBrand">TaskFlow</strong>
      <p class="tfSplashMotto">ORGANIZA · AVANZA · CUMPLE</p>
      <div class="tfSplashDivider" aria-hidden="true"></div>
      <div class="tfSplashLoaderText"><i class="tfSplashLight" aria-hidden="true"></i><span>Cargando TaskFlow...</span></div>
      <div class="tfSplashMeter" role="progressbar" aria-label="Inicio de TaskFlow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tfSplashMeter">
        <span class="tfSplashTrack"><i id="tfSplashFill"></i></span><strong id="tfSplashPercent">0%</strong>
      </div>
      <div class="tfSplashTiles" aria-hidden="true">
        <div class="tfSplashTile"><span class="tfSplashTileIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7 12 3 3 7-7"/></svg></span><span class="tfSplashTileLabel">HÁBITOS</span></div>
        <div class="tfSplashTile"><span class="tfSplashTileIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5h12M9 12h12M9 19h12"/><circle cx="4" cy="5" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="19" r="1" fill="currentColor"/></svg></span><span class="tfSplashTileLabel">TAREAS</span></div>
        <div class="tfSplashTile"><span class="tfSplashTileIcon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="15" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg></span><span class="tfSplashTileLabel">PROGRESO</span></div>
        <div class="tfSplashTile"><span class="tfSplashTileIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 4h8v3h5v3c0 4-2 6-5 6-1 1-2 2-3 2v3h4v2H7v-2h4v-3c-1 0-2-1-3-2-3 0-5-2-5-6V7h5V4Z"/><path d="M8 7v5M16 7v5"/></svg></span><span class="tfSplashTileLabel">RESULTADOS</span></div>
      </div>
      <div class="tfSplashSignature">
        <div class="tfSplashSigTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 18 7-7 4 4 7-10M15 5h6v6"/></svg><span>TaskFlow</span></div>
        <div class="tfSplashSigSub">TU SISTEMA DE PRODUCTIVIDAD</div>
        <div class="tfSplashSigPill"><span><b>◇</b> Organiza</span><span><b>ϟ</b> Avanza</span><span><b>◎</b> Cumple</span></div>
      </div>
    </section>
  </div>
</div>
<div id="tfBoot" role="alert" aria-live="assertive" hidden><div class="tfCard"><p class="tfErr" id="tfErr">No fue posible iniciar TaskFlow. Comprueba tu conexión y vuelve a intentarlo.</p><button class="tfRetry" type="button" onclick="location.reload()">Reintentar</button></div></div>
<script src="./taskflow-microslats.js?v=2-touch-ripple" defer></script>
<script>
(async function(){
'use strict';
const boot=document.getElementById('tfBoot');
const splash=document.getElementById('tfSplash');
const splashFill=document.getElementById('tfSplashFill');
const splashPct=document.getElementById('tfSplashPercent');
const splashMeter=document.getElementById('tfSplashMeter');
const SPLASH_MS=10000;
const splashStart=performance.now();
let splashDone=false,progressRaf=0;
function showProgress(now){
 if(splashDone||!splash.isConnected)return;
 const value=Math.max(0,Math.min(100,Math.floor((now-splashStart)*100/SPLASH_MS)));
 if(splashFill)splashFill.style.transform='scaleX('+(value/100)+')';
 if(splashPct)splashPct.textContent=value+'%';
 if(splashMeter)splashMeter.setAttribute('aria-valuenow',String(value));
 if(value<100)progressRaf=requestAnimationFrame(showProgress);
}
progressRaf=requestAnimationFrame(showProgress);
function endSplash(){
 try{window.TaskFlowMicroSlats&&window.TaskFlowMicroSlats.stop()}catch(_){}
 splashDone=true;
 if(progressRaf)cancelAnimationFrame(progressRaf);
 splash.hidden=true;
}
async function keepSplashExactlyTenSeconds(){
 const remaining=Math.max(0,SPLASH_MS-(performance.now()-splashStart));
 if(remaining>0)await new Promise(resolve=>setTimeout(resolve,remaining));
 // Los temporizadores pueden retrasarse si la aplicación queda en segundo plano.
 // Nunca sustituir una app incompleta por una pantalla vacía.
}

const parts=["t57/runtime-00.txt","t57/runtime-01.txt","t57/runtime-02.txt","t57/runtime-03.txt","t57/runtime-04.txt","t57/runtime-05.txt","t57/runtime-06.txt","t57/runtime-07.txt","t57/runtime-08.txt","t57/runtime-09.txt","t57/runtime-10.txt","t57/runtime-11.txt","t57/runtime-12.txt","t57/runtime-13.txt","t57/runtime-14.txt","t57/runtime-15.txt","t57/runtime-16.txt","t57/runtime-17.txt","t57/runtime-18.txt","t57/runtime-19.txt","t57/runtime-20.txt","t57/runtime-21.txt","t57/runtime-22.txt","t57/runtime-23.txt","t57/runtime-24.txt"];
try{
 // Limitar conexiones simultáneas evita saturar redes móviles y WebViews.
 const texts=new Array(parts.length);
 let next=0;
 async function loadPart(p){
   const version=p==='t57/runtime-00.txt'?'?v=71-hub-cards-20261106':/^t57\/runtime-0[012]\.txt$/.test(p)?'?v=63-no-splash-assets-20261106':p==='t57/runtime-06.txt'?'?v=59-auth-memory-20261106':p==='t57/runtime-24.txt'?'?v=81-noads-entitlement-20261107':p==='t57/runtime-19.txt'?'?v=73-campaign-results-all-ads-20261107':'?v=57-ads21-paypal6-dailyfix1';
   const url='./'+p+version;
   for(let attempt=0;attempt<2;attempt++){
     const controller=new AbortController();
     const timeout=setTimeout(()=>controller.abort(),14000);
     try{
       const response=await fetch(url,{cache:'default',credentials:'same-origin',signal:controller.signal});
       if(!response.ok)throw new Error('LOAD_'+response.status);
       const body=await response.text();
       if(!body||body.length<50)throw new Error('EMPTY_PART');
       return body;
     }catch(error){
       if(attempt===1||/LOAD_4\d\d/.test(String(error&&error.message)))throw error;
       await new Promise(resolve=>setTimeout(resolve,260));
     }finally{clearTimeout(timeout)}
   }
 }
 async function worker(){
   for(;;){
     const i=next++;
     if(i>=parts.length)return;
     texts[i]=await loadPart(parts[i]);
   }
 }
 await Promise.all(Array.from({length:Math.min(6,parts.length)},()=>worker()));
 const html=texts.join('');
 if(!html.toLowerCase().includes('<!doctype html>')||!html.includes('TF_T57')||!/<\/html>\s*$/i.test(html))throw new Error('INVALID');
 await keepSplashExactlyTenSeconds();
 endSplash();
 document.open();document.write(html);document.close();
}catch(error){console.warn('TaskFlow: fallo de arranque',error&&error.message||error);endSplash();boot.hidden=false;boot.classList.add('error')}
})();
</script>
</body>
</html>
