name: TaskFlow - Verificacion integral

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar todos los modulos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n 1 node --check
      - name: Verificar nucleo empaquetado, carga y cache offline
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const zlib=require('node:zlib');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const read=path=>fs.readFileSync(path,'utf8');
          const exists=path=>fs.existsSync(path);
          const root=read('index.html');
          const loader=read('taskflow-loader-v102.html');
          const sw=read('taskflow-offline-sw.js');
          const parts=['p0.txt','p1.txt','p2.txt',...Array.from({length:14},(_,i)=>'q'+i+'.txt')];
          const payload=parts.map(p=>read('taskflow-v99-deploy/'+p).trim()).join('');
          const length=Number(loader.match(/const expectedLength=(\d+);/)?.[1]);
          const hash=loader.match(/const expectedHash='([0-9a-f]+)'/)?.[1];
          assert.equal(payload.length,length,'Paquete incompleto');
          assert.equal(crypto.createHash('sha256').update(payload).digest('hex'),hash,'Integridad del nucleo');
          const core=zlib.gunzipSync(Buffer.from(payload,'base64')).toString('utf8');
          assert.ok(core.length>600000&&core.includes('<html'),'Nucleo HTML incompleto');
          assert.equal(core.split('function v30OpenStore(){').length-1,1,'Definicion de tienda');
          assert.ok(core.includes('function setupQuickActionButtons(){'),'Acciones principales ausentes');
          assert.ok(loader.includes('V130.13.5'),'Falta reparación actual de tienda');
          assert.ok(loader.includes('tfShopHistorySafeV130126'),'Saneamiento de historial ausente');
          assert.ok(loader.includes('tf130134-catalog-fallback'),'Catálogo de recuperación ausente');
          for(const item of [['index',root],['loader',loader],['core',core]]){
            const name=item[0],html=item[1];
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            assert.ok(blocks.length>=1,name+': script principal ausente');
            for(const block of blocks) new vm.Script(block[1],{filename:name+'.js'});
          }
          // Probar la protección vigente V130.13.5 sobre el núcleo empaquetado.
          const at=loader.indexOf('// V130.13.5 — La Tienda siempre ofrece');
          const end=loader.indexOf('if(html.length<600000',at);
          assert.ok(at>0&&end>at,'Protección vigente no localizada');
          const applyStoreFix=source=>{
            const sandbox={html:source,console:{warn(){},error(){}}};
            vm.runInNewContext(loader.slice(at,end),sandbox,{timeout:5000});
            return sandbox.html;
          };
          const patched=applyStoreFix(core);
          assert.notEqual(patched,core,'La función de tienda no fue protegida');
          assert.ok(patched.includes('tf130134-catalog-fallback'),'Falta catálogo de recuperación');
          const patchedScripts=[...patched.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          assert.ok(patchedScripts.length>0,'No hay script en el núcleo protegido');
          for(const script of patchedScripts) new vm.Script(script[1],{filename:'tienda-reparada.js'});
          const incompatible=core.replace('function v30OpenStore(){','function v30OpenStore_INCOMPATIBLE(){');
          assert.notEqual(incompatible,core,'No se pudo simular un núcleo incompatible');
          assert.equal(applyStoreFix(incompatible),incompatible,'Una firma distinta nunca debe bloquear el arranque');
          const assets=JSON.parse(sw.match(/const APP_FILES=(\[[\s\S]*?\]);/)?.[1]||'[]');
          assert.ok(assets.length>40,'Lista offline incompleta');
          const missing=assets.filter(p=>p!=='./'&&!exists(p.replace(/^\.\//,'')));
          assert.deepEqual(missing,[],'Archivos faltantes del cache offline');
          for(const asset of ['taskflow-loader-v102.html','taskflow-v130120-settings-rewards.css','taskflow-v130114-profile-reference.css']){
            assert.ok(assets.includes(asset),'Falta recurso offline '+asset);
          }
          console.log('OK: sintaxis del cargador, nucleo, historial y proteccion de Tienda');
          console.log('OK: '+parts.length+' partes y '+assets.length+' recursos offline existentes');
          NODE
