name: TaskFlow - Verificacion integral
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript del repositorio
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n 1 node --check
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar paquete, cargador, Tienda y recursos offline
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const zlib=require('node:zlib');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const read=path=>fs.readFileSync(path,'utf8');
          const exists=path=>fs.existsSync(path);
          const root=read('index.html');
          const loader=read('taskflow-loader-v102.html');
          const sw=read('taskflow-offline-sw.js');
          const bridge=read('taskflow-ads-bridge.js');
          const adsRuntime=read('taskflow-ads-runtime-v157.js');
          const parts=['p0.txt','p1.txt','p2.txt',...Array.from({length:14},(_,i)=>'q'+i+'.txt')];
          const payload=parts.map(p=>read('taskflow-v99-deploy/'+p).trim()).join('');
          const length=Number(loader.match(/const expectedLength=(\d+);/)?.[1]);
          const hash=loader.match(/const expectedHash='([0-9a-f]+)'/)?.[1];
          assert.equal(payload.length,length,'Número de bytes del paquete');
          assert.equal(crypto.createHash('sha256').update(payload).digest('hex'),hash,'SHA del paquete');
          const core=zlib.gunzipSync(Buffer.from(payload,'base64')).toString('utf8');
          assert.ok(core.length>600000&&core.includes('<html'),'El núcleo no es un HTML válido');
          assert.equal(core.split('function v30OpenStore(){').length-1,1,'Tienda debe tener una definición');
          assert.ok(core.includes('function setupQuickActionButtons(){'),'Faltan acciones rápidas');
          assert.ok(loader.includes('tfShopHistorySafeV130126'),'Falta saneamiento no destructivo del historial');
          assert.ok(!loader.includes('Preparando el sistema')&&loader.includes('.boot.error'),'El cargador visual antiguo sigue disponible o falta recuperación');
          assert.ok(root.includes('const SPLASH_MS=10000')&&root.includes('taskflow-loading-fhd-1080x1920.webp')&&exists('taskflow-loading-fhd-1080x1920.webp')&&root.includes('await keepSplashExactlyTenSeconds()'),'Falta pantalla colorida oficial de 10 segundos en inicio principal');
          assert.ok(loader.includes('SPLASH_MS=10000')&&loader.includes('await waitForColorSplash()')&&loader.includes('taskflow-loading-reference.jpg'),'Falta pantalla colorida en cargador auxiliar');
          assert.ok(exists('taskflow-v58-stability.js')&&/version:'3\.\d+\.\d+'/.test(bridge),'Falta módulo vigente y puente ADS actualizado');
          assert.ok(bridge.includes('function testedBanner(ad)')&&bridge.includes('async function displayBanner(slot)')&&bridge.includes('function validBannerPixels(img)'),'No se comprueba la carga real de banners');
          assert.ok(root.includes('t57/runtime-24.txt')&&root.includes('TF_T57'),'Falta el arranque vigente T57');
          assert.ok(!root.includes('Función de tienda inesperada; se conserva el paquete original'),'Error de arranque antiguo reintroducido');
          assert.ok(bridge.includes('enabled:true')&&bridge.includes("credentials:'omit'"),'ADS debe consultar solo el catálogo público sin credenciales');
          for (const item of [['index',root],['loader',loader],['core',core]]) {
            const scripts=[...item[1].matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            assert.ok(scripts.length>=1,item[0]+': falta script');
            for(const script of scripts)new vm.Script(script[1],{filename:item[0]+'.js'});
          }
          const assets=JSON.parse(sw.match(/const APP_FILES=(\[[\s\S]*?\]);/)?.[1]||'[]');
          assert.ok(assets.length>40,'Lista offline incompleta');
          assert.ok(assets.includes('taskflow-splash-particles-v156.js')&&root.includes('await loadingClock;\n await keepSplashExactlyTenSeconds()'),'La carga de 10 segundos debe empezar después de las partículas y conservarse sin conexión');
          const missing=assets.filter(p=>p!=='./'&&!exists(p.replace(/^\.\//,'')));
          assert.deepEqual(missing,[],'Recursos ausentes del modo offline');
          for(const asset of ['taskflow-loader-v102.html','taskflow-v130120-settings-rewards.css','taskflow-v130114-profile-reference.css','taskflow-ads-bridge.js','taskflow-ads-runtime-v157.js','taskflow-visual-v158.css','taskflow-icons-v158.js','taskflow-selects-v159.js','taskflow-v58-stability.js','payments/paypal/client.js']){
            assert.ok(assets.includes(asset),'Falta en caché '+asset);
          }
          const live=read('t57/runtime-24.txt');
          assert.ok(adsRuntime.includes('img.naturalWidth === WIDTH*2')&&adsRuntime.includes('v.videoWidth === WIDTH*2'),'Anuncios HD 2x no admitidos');
          assert.ok(!live.includes("let stamp=Number(get('tf_audio_reset_device_t34'))"),'Reinicio diario confundido con reinicio manual');
          assert.ok(live.includes('taskflow-v58-stability.js'),'Protección diaria no cargada');
          assert.ok(live.includes('function installSharedRoutineLayout()')&&live.includes('tfSharedRoutineLayoutV156')&&live.includes('headExtras:headExtras+routineStyle'),'La vista común de rutinas debe inyectarse en el documento final');
          for(const k of ['tf21-legal','tf32-socrates','tf33-machiavelli'])assert.ok(live.includes(k),'Falta rutina '+k);
          assert.ok(adsRuntime.includes('const REQUIRED_TAPS = 10;')&&adsRuntime.includes('taskflow_interaction_ad_count_v160'),'Los clics publicitarios deben acumularse en grupos de diez');
          assert.ok(!adsRuntime.includes('taskflow_entry_ad_completed_session')&&read('t57/runtime-19.txt').includes('taskflow-ads-runtime-v157.js'),'El anuncio de ingreso debe activarse en cada apertura');
          for (const id of ['tfAdBannerTimer','tfAdBannerHabitsTasks','tfAdBannerFooter','tfAdBannerRoutine','tfAdBannerMenu','tfAdBannerHabits','tfAdBannerTasks']) assert.ok(adsRuntime.includes(id),'Falta espacio publicitario '+id);
          const activeParts=JSON.parse(root.match(/const parts=(\[[^;]+\]);/)?.[1]||'[]');
          assert.ok(activeParts.length&&activeParts.every(exists),'Faltan fragmentos activos');
          const runtimeSource=activeParts.map(read).join('');
          assert.ok(!runtimeSource.includes('const TF_T38_ICON_LIBRARY_JS=')&&runtimeSource.includes('TaskFlowIconsV158.install'),'El selector debe utilizar vectores locales');
          assert.ok(adsRuntime.includes('function promoLink(placement)')&&bridge.includes('enableUnfilledVerticalPromos'),'Falta la promoción de inventario disponible');
          const startChunks=['00','01','02'].map(id=>read('t57/runtime-'+id+'.txt')).join('');
          assert.ok(!startChunks.includes('aria-label="Cargando TaskFlow"')&&!startChunks.includes('Preparando TaskFlow…'),'Se reintrodujo la pantalla de carga antigua');
          assert.ok(!startChunks.includes('filter:blur(24px) brightness(.46)')&&startChunks.includes('#boot.error'),'Recursos pesados de splash o recuperación ausente');
          assert.ok(root.includes('63-no-splash-assets-20261106'),'El cargador referencia fragmentos antiguos');
          assert.ok(bridge.includes('mediaWidth:width')&&bridge.includes('function queueBanner(slot)'),'Falta preferencia HD y carga diferida');
          assert.ok(adsRuntime.includes('.tf159-ad-continue')&&adsRuntime.includes('button.disabled = !ready')&&adsRuntime.includes('root.showModal()')&&adsRuntime.includes('root.close()'),'Falta cierre seguro o acción Continuar');
          assert.ok(adsRuntime.includes('const HOLD_MS = 10000;')&&adsRuntime.includes('button.hidden = !ready;')&&!adsRuntime.includes('showingPromo || elapsed'),'Continuar debe aparecer tras diez segundos también en promociones');
          assert.ok(bridge.includes('.onSnapshot(')&&bridge.includes('/choose/v161')&&!bridge.includes('/geo/presence')&&!bridge.includes('TaskFlowLocationV52'),'ADS debe escuchar el catálogo y respetar la ubicación local');
          for(const name of ['taskflow-policies-v161.js','taskflow-onboarding-v161.css','taskflow-ads-preferences-v161.js'])assert.ok(assets.includes(name),'Recurso de ingreso o ADS ausente '+name);
          assert.ok(root.indexOf('await window.TaskFlowPoliciesV161.requireAcceptance()')<root.indexOf('await Promise.all(Array.from({length:Math.min(6,parts.length)}')&&root.includes('await window.TaskFlowPoliciesV161.requireAcceptance()'),'Las políticas deben preceder la carga del sistema');
          assert.ok(adsRuntime.includes("v.preload='auto'")&&adsRuntime.includes('v.setAttribute(\'webkit-playsinline\',\'\')'),'Vídeos publicitarios sin precarga de resolución original');

          assert.ok(root.includes('Math.min(6,parts.length)')&&root.includes('AbortController'),'Cargador T57 sin límite de concurrencia');
          assert.ok(root.includes("p==='t57/runtime-06.txt'"),'Falta versión de autenticación segura');
          const liveAuth=read('t57/runtime-06.txt');
          assert.ok(liveAuth.includes('st.idToken=null;st.expiresAt=0;')&&!liveAuth.includes('idToken:st.idToken,expiresAt:st.expiresAt'),'El token temporal no debe persistirse');
          const liveHead=read('t57/runtime-00.txt');
          assert.ok(liveHead.includes("object-src 'none'")&&liveHead.includes('no-referrer'),'Falta protección básica en T57');
          assert.ok(sw.includes('async function previousRuntimeResource')&&sw.includes('const key=url.href;'),'No se conserva respaldo de fragmentos offline');
          assert.ok(sw.includes('old.match(url.href)')&&!sw.includes('old.match(url.origin+url.pathname,{ignoreSearch:true})'),'Recuperación offline mezcla revisiones de fragmentos');
          assert.ok(sw.includes('async function freshStaticResource')&&sw.includes("cache:'no-cache'"),'Los JS/CSS deben actualizarse con respaldo offline');
          const paypalConfig=JSON.parse(read('payments/paypal/public-config.json'));
          const paypalClient=read('payments/paypal/client.js');
          const paypalServer=read('payments/paypal/functions/index.js');
          assert.equal(paypalConfig.enabled,'auto','La conexión comercial utiliza modo de detección segura');
          assert.equal(new URL(paypalConfig.apiBase).protocol,'https:','El backend de pago debe tener HTTPS');
          assert.ok(paypalClient.includes("data.environment!=='live'"),'No habilitar pagos Sandbox en producción');
          assert.ok(paypalServer.includes("function liveCheckoutReady()")&&paypalServer.includes("ENV==='live'"),'El servidor debe restringir producción a PayPal Live');
          assert.ok(paypalServer.includes("webhookId.value()")&&paypalServer.includes('linkPendingSubscription(uid,sub)'),'Falta validación de webhook o vinculación de pago pendiente');
          assert.ok(!paypalClient.includes('EG2DrW3o')&&!paypalServer.includes('EG2DrW3o'),'Se filtró una credencial de PayPal');
          console.log('OK: núcleo, carga T57, autenticación, protección, ADS HD, PayPal Live preparado y',assets.length,'archivos offline.');
          NODE

      - name: Probar reinicio regional a medianoche y cargador
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const s=fs.readFileSync('t57/runtime-03.txt','utf8');
          const name='TF_CLOCK_T13_JS',p=s.indexOf('const '+name+'=');
          assert.ok(p>=0,'No se encontro el reloj');
          const a=p+('const '+name+'=').length,b=s.indexOf(';\nconst ',a);
          assert.ok(b>a,'Reloj regional incompleto');
          const js=vm.runInNewContext(s.slice(a,b));new vm.Script(js);
          for(const [label,latitude,longitude,at,expect] of [
            ['Guatemala',14.6349,-90.5069,'2026-11-09T05:59:59Z','2026-11-09T06:00:00Z'],
            ['Guatemala pasada medianoche',14.6349,-90.5069,'2026-11-09T06:00:00Z','2026-11-10T06:00:00Z'],
            ['Tokio',35.68,139.69,'2026-11-08T14:59:59Z','2026-11-08T15:00:00Z'],
            ['Nueva York',40.71,-74.01,'2026-11-09T04:59:59Z','2026-11-09T05:00:00Z'],
            ['Londres DST',51.51,-0.1,'2026-03-29T00:00:00Z','2026-03-29T23:00:00Z'],
            ['Sidney DST',-33.86,151.2,'2026-10-03T14:00:00Z','2026-10-04T13:00:00Z']
          ]){
            const window={addEventListener(){},TaskFlowLocationV52:{getCached:()=>({latitude,longitude,accuracy:80,timestamp:Date.now()})}};
            const document={readyState:'loading',hidden:false,addEventListener(){},getElementById(){return null}};
            vm.runInNewContext(js,{window,document,navigator:{},localStorage:{getItem(){return 'granted'}},console,Intl,Date});
            assert.equal(new Date(window.TaskFlowRegionalClock.getCycle(Date.parse(at)).reset).toISOString(),new Date(expect).toISOString(),label);
          }
          const runtimeParts=JSON.parse(fs.readFileSync('index.html','utf8').match(/const parts=(\[[^;]+\]);/)[1]);
          const runtime=runtimeParts.map(path=>fs.readFileSync(path,'utf8')).join('');
          const scripts=[...runtime.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          assert.ok(scripts.length>=2,'Faltan scripts en el sistema reconstruido');
          for(const script of scripts)new vm.Script(script[1],{filename:'TaskFlow-T57.js'});
          const live=fs.readFileSync('t57/runtime-24.txt','utf8');
          assert.ok(live.includes('window.__tfT57BootPatches.views'),'El inicio debe reutilizar codigo existente');
          assert.ok(!live.includes('const storeRepair=\'html=(\'+protectStoreMarkup.toString()'),'Regresion a compilacion duplicada del arranque');
          for(const file of ['taskflow-v58-stability.js','taskflow-v117.js','taskflow-v120.js','taskflow-v121-resetfix.js']){
            const source=fs.readFileSync(file,'utf8');new vm.Script(source,{filename:file});
            assert.ok(!source.includes('America/Guatemala'),'Zona fija en '+file);
            assert.ok(!source.includes('if(h<1)'),'Reinicio a la 01:00 en '+file);
          }
          console.log('OK: medianoche por zona, horario de verano y arranque sin recompilacion duplicada');
          NODE
