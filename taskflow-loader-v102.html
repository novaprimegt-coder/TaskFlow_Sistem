      html=html.replace(/if\(qaNoAds\)qaNoAds\.onclick=handleNoAdsAction;/,`if(qaNoAds)qaNoAds.onclick=handleNoAdsAction;`);
      html=html.replace(/http:\/\/action_search/g,'http://action_noads');
